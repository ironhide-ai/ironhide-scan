name: "Ironhide Scan"
description: "Pull the agent your PR builds into a sandboxed arena, attack it, and post an observed-state verdict — graded on what the agent did, not what it said."
author: "Ironhide"
branding:
  icon: "shield"
  color: "orange"

inputs:
  api_key:
    description: "Your agent's Ironhide API key. Always pass it from a repository secret named IRONHIDE_API_KEY — never commit it."
    required: true
  agent_id:
    description: "The connected agent's id (from `ironhide connect`). Optional if the repo commits a .ironhide.yml carrying agent_id; otherwise set it here so a fresh CI checkout can resolve the agent."
    required: false
    default: ""
  adapter:
    description: "Customer driver module:object; overrides .ironhide.yml. Mutually exclusive with agent_factory."
    required: false
    default: ""
  agent_factory:
    description: "Customer tool-binding factory module:callable; overrides .ironhide.yml. Mutually exclusive with adapter."
    required: false
    default: ""
  cli_sha256:
    description: "Required SHA-256 of the approved CLI release. Verified before any downloaded code is executed."
    required: true
  cli_url:
    description: "Where the verified CLI is fetched from. Defaults to the immutable release asset that ships with this Action version, so the pinned cli_sha256 stays valid for the life of the tag. Point it elsewhere only if you mirror the asset internally — a live server path would change under you on every Ironhide deploy and break this gate."
    required: false
    default: "https://github.com/ironhide-ai/ironhide-scan/releases/download/v2.2.0/ironhide.py"
  advisory_mode:
    description: "true (default) reports security regressions without failing. An UNAVAILABLE result the CLI marks advisory_pass=true - the evidence could not decide (an unconfirmed rise, a baseline too small to compare, a run left unverified by rate limits, a server-side outage) - is reported as NOT DECIDED with a warning and does not fail the build; it is never a pass. Configuration and setup failures (bad config or key, an agent that failed on every episode, nothing graded) still fail. Set false to gate: a FAIL, a BLOCK per block_on, or any UNAVAILABLE fails the build."
    required: false
    default: "true"
  block_on:
    description: "Comma-separated effect categories that hard-block without statistics when advisory_mode is false — one observed effect in a listed category yields BLOCK. Add 'inconclusive' if unverified runs must not merge."
    required: false
    default: "exfiltration"
  runs:
    description: "Samples per episode. Empty = project configuration or CLI default. A profile selects WHICH episodes run; it does not change how many samples each one gets."
    required: false
    default: ""
  profile:
    description: "Optional coverage profile: pr (bounded selection) or full (complete routed population). Empty preserves legacy coverage and the baselines already recorded against it."
    required: false
    default: ""
  suite:
    description: "actions (agent-action tests built from your agent's own tool list) or library (the episode library). Empty uses .ironhide.yml suite."
    required: false
    default: ""
  pack:
    description: "Action tests: the scenario pack - general, fsm, crm or erp. Empty uses .ironhide.yml pack."
    required: false
    default: ""
  tools_file:
    description: "Action tests: a JSON tool list (MCP tools/list, OpenAI function schemas, or name/params rows) for tools built at runtime. Empty uses .ironhide.yml tools_file, then discovery."
    required: false
    default: ""
  baseline_branch:
    description: "The branch whose trailing clean rate is the baseline this PR is compared against. A run ON this branch refreshes the baseline; every other run reads it without writing."
    required: false
    default: "main"
  server:
    description: "Ironhide server base URL."
    required: false
    default: "https://app.ironhideai.com"
  comment:
    description: "Post (and update) the verdict as a PR comment. Needs 'permissions: pull-requests: write'."
    required: false
    default: "true"

outputs:
  result:
    description: "The verdict: PASS / FAIL / BLOCK / WARN / INCONCLUSIVE / BASELINE / UNAVAILABLE."
    value: ${{ steps.test.outputs.result }}
  gate_line:
    description: "The full machine-readable IRONHIDE-GATE line."
    value: ${{ steps.test.outputs.gate_line }}
  baseline_restored:
    description: "true when a baseline cache matched. Inspect result and graded to confirm a comparison ran."
    value: ${{ steps.restore.outputs.cache-matched-key != '' }}

runs:
  using: "composite"
  steps:
    # The client holds its own baseline. `ironhide test` writes it to
    # `.ironhide/baseline-<label>.json` RELATIVE TO THE WORKING DIRECTORY
    # (cli/ironhide.py: BASELINE_DIR = ".ironhide"), so that is the path
    # persisted here. It has to be the same string: this step used to cache
    # `~/.ironhide/baselines`, a path the CLI has never written and has no code
    # to write (no path it builds carries a "baselines" segment), so the restore
    # was a no-op, every run was a first run, and the gate returned BASELINE and
    # exit 0 forever. tests/test_cli.py now pins this path to the CLI constant
    # so the two cannot drift apart again.
    #
    # This step must run AFTER the caller's actions/checkout: checkout's default
    # `clean: true` runs `git clean -ffdx`, which would delete a restored,
    # untracked .ironhide/. As a composite action's steps run in the caller's
    # job after the steps above it, that ordering holds for the documented
    # workflow — keep this action after checkout.
    #
    # RESTORE-ONLY, on purpose. The save is a separate step below, gated on the
    # baseline branch: a merge request must not rewrite the baseline it is being
    # judged against, or a PR's second run gates against the PR's own already
    # regressed first run and the regression disappears. This is the same
    # pull-vs-pull-push split the published GitLab component uses.
    #
    # The key interpolates github.run_id, so the exact key can never hit and the
    # restore always falls through to the prefix in restore-keys — which is the
    # intent: restore the MOST RECENT baseline for this branch, then (on the
    # baseline branch only) write a fresh one under a new unique key. A stable
    # exact key would hit the first cache written and never pick up a newer one,
    # because a cache entry is immutable once created.
    - name: Restore the Ironhide baseline
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: .ironhide
        key: ironhide-baseline-${{ inputs.profile != '' && format('profile-{0}-', inputs.profile) || '' }}${{ inputs.baseline_branch }}-${{ github.run_id }}
        restore-keys: |
          ironhide-baseline-${{ inputs.profile != '' && format('profile-{0}-', inputs.profile) || '' }}${{ inputs.baseline_branch }}-

    - name: Install the Ironhide CLI
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-verified.sh"
      env:
        IRONHIDE_URL: ${{ inputs.server }}
        CLI_SHA256: ${{ inputs.cli_sha256 }}
        CLI_URL: ${{ inputs.cli_url }}

    - name: Run ironhide test
      id: test
      shell: bash
      env:
        IRONHIDE_API_KEY: ${{ inputs.api_key }}
        IRONHIDE_URL: ${{ inputs.server }}
        IRONHIDE_ADVISORY: ${{ inputs.advisory_mode }}
        IRONHIDE_BLOCK_ON: ${{ inputs.block_on }}
        IRONHIDE_SAMPLES: ${{ inputs.runs }}
        IRONHIDE_PROFILE: ${{ inputs.profile }}
        IRONHIDE_SUITE: ${{ inputs.suite }}
        IRONHIDE_PACK: ${{ inputs.pack }}
        IRONHIDE_TOOLS: ${{ inputs.tools_file }}
        BASELINE_LABEL: ${{ inputs.baseline_branch }}
        AGENT_ID: ${{ inputs.agent_id }}
        ADAPTER: ${{ inputs.adapter }}
        AGENT_FACTORY: ${{ inputs.agent_factory }}
        IRONHIDE_REQUIRE_DRIVER: "true"
      run: |
        agent_args=()
        [ -n "$AGENT_ID" ] && agent_args+=(--agent-id "$AGENT_ID")
        [ -n "$ADAPTER" ] && agent_args+=(--adapter "$ADAPTER")
        [ -n "$AGENT_FACTORY" ] && agent_args+=(--agent-factory "$AGENT_FACTORY")
        profile_args=()
        [ -n "$IRONHIDE_PROFILE" ] && profile_args+=(--profile "$IRONHIDE_PROFILE")
        output="$(mktemp "${RUNNER_TEMP:-/tmp}/ironhide-out.XXXXXX")"
        trap 'rm -f "$output"' EXIT
        set +e
        ironhide test "${agent_args[@]}" "${profile_args[@]}" --label "$BASELINE_LABEL" 2>&1 | tee "$output"
        code=${PIPESTATUS[0]}
        set -e
        gate_line="$(grep -E '^IRONHIDE-GATE ' "$output" | tail -1 || true)"
        result="$(printf '%s' "$gate_line" | grep -oE '(^| )result=[A-Z_]+' | tail -1 | cut -d= -f2 || true)"
        graded="$(printf '%s' "$gate_line" | grep -oE '(^| )graded=[0-9]+' | tail -1 | cut -d= -f2 || true)"
        basis="$(printf '%s' "$gate_line" | grep -oE '(^| )basis=[A-Za-z0-9_-]+' | tail -1 | cut -d= -f2 || true)"
        reason="$(printf '%s' "$gate_line" | grep -oE '(^| )reason=[a-z_]+' | tail -1 | cut -d= -f2 || true)"
        line_advisory="$(printf '%s' "$gate_line" | grep -oE '(^| )advisory=[a-z]+' | tail -1 | cut -d= -f2 || true)"
        advisory_pass="$(printf '%s' "$gate_line" | grep -oE '(^| )advisory_pass=[a-z]+' | tail -1 | cut -d= -f2 || true)"
        case "$result" in
          PASS|FAIL|ADVISORY|BASELINE|UNAVAILABLE) ;;
          *) result=UNAVAILABLE ;;
        esac
        advisory="$(printf '%s' "$IRONHIDE_ADVISORY" | tr '[:upper:]' '[:lower:]')"
        advisory_on=false
        case "$advisory" in true|1|yes|on) advisory_on=true ;; esac
        # NOT DECIDED under advisory mode. The CLI decides which UNAVAILABLE
        # causes advisory mode may let through (a statistical can't-tell, a run
        # left unverified by rate limits, a server-side outage) and declares it
        # with advisory_pass=true - so a new cause never needs a new Action
        # release. The two server-outage reasons are still honoured for older
        # CLIs that predate advisory_pass. Anything else UNAVAILABLE fails.
        # Still UNAVAILABLE - never a pass - and said out loud.
        if [ "$code" = 0 ] && [ "$result" = UNAVAILABLE ] && [ "$advisory_on" = true ] \
            && { { [ "$advisory_pass" = true ] && [ "$line_advisory" = true ]; } \
                 || [ "$reason" = run_quota_exceeded ] || [ "$reason" = action_envs_disabled ]; }; then
          msg="NOT DECIDED - ${reason:-unknown} (see the log above); this run did not block because advisory mode is on. Nothing was decided, so this is not a pass. Set advisory_mode: false to make it fail the build."
          echo "::warning title=Ironhide did not decide this change::${msg}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "Ironhide: ${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
        # A missing gate line or unmeasured population is never green, even if
        # an incompatible CLI returned zero. Advisory cannot suppress this.
        elif [ "$code" = 0 ] && { [ -z "$graded" ] || [ "$graded" = 0 ] || [ "$result" = UNAVAILABLE ] || [ -z "$result" ]; }; then
          code=2
          result=UNAVAILABLE
          gate_line="IRONHIDE-GATE${basis:+ basis=$basis} result=UNAVAILABLE graded=0"
          echo "::error::No eligible observations were graded. Set adapter to your agent and check the CLI release."
        fi
        # Customer code can print gate-shaped text. A nonzero CLI exit never
        # supports a successful status in the output or PR comment.
        case "$result" in
          PASS|ADVISORY|BASELINE)
            if [ "$code" != 0 ]; then
              result=UNAVAILABLE
              gate_line="IRONHIDE-GATE${basis:+ basis=$basis} result=UNAVAILABLE graded=0"
            fi
            ;;
        esac
        echo "result=${result:-UNAVAILABLE}" >> "$GITHUB_OUTPUT"
        {
          echo "gate_line<<__EOF__"
          printf '%s\n' "$gate_line"
          echo "__EOF__"
        } >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"

    # A gate that never gates must SAY SO. `result=BASELINE` exits 0 and reads
    # like a green check, but it means "there was nothing to compare" — and a
    # repo whose workflow only runs on pull_request never writes a baseline on
    # the baseline branch, so every run of every PR lands here, forever, looking
    # green. This annotation is the difference between a misconfiguration you
    # find and one you ship on top of.
    - name: Say so when this run did not gate
      if: ${{ steps.test.outputs.result == 'BASELINE' }}
      shell: bash
      env:
        BASELINE_BRANCH: ${{ inputs.baseline_branch }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        # One line: a workflow-command annotation is terminated by a newline.
        msg="No baseline was restored for '${BASELINE_BRANCH}' (cache key matched: '${MATCHED:-none}'), so this run only RECORDED a baseline. Nothing was compared and nothing could have failed. Run this action on '${BASELINE_BRANCH}' itself (add a push trigger for that branch) so pull requests have a baseline to be judged against. Do not read BASELINE as 'nothing regressed'."
        echo "::warning title=Ironhide did not gate this run::${msg}"
        echo "$msg" >> "$GITHUB_STEP_SUMMARY"

    # Only a successful push on the baseline branch may persist its baseline.
    # A PR can restore it but must never replace the comparison standard.
    - name: Refresh the Ironhide baseline
      if: ${{ github.event_name == 'push' && github.ref_name == inputs.baseline_branch && steps.test.outputs.code == '0' && steps.test.outputs.result != 'UNAVAILABLE' }}
      uses: actions/cache/save@v4
      with:
        path: .ironhide
        key: ironhide-baseline-${{ inputs.profile != '' && format('profile-{0}-', inputs.profile) || '' }}${{ inputs.baseline_branch }}-${{ github.run_id }}

    - name: Post the verdict on the PR
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RESULT: ${{ steps.test.outputs.result }}
        GATE_LINE: ${{ steps.test.outputs.gate_line }}
      run: ${{ github.action_path }}/comment.sh

    - name: Enforce the gate
      shell: bash
      if: ${{ always() }}
      env:
        TEST_CODE: ${{ steps.test.outputs.code }}
      run: exit "${TEST_CODE:-2}"
