# Ironhide referee gate — GitLab CI/CD component.
#
#   include:
#     - component: $CI_SERVER_FQDN/ironhide1/ironhide-scan/ironhide@1
#
# Set masked CI/CD variables (Settings -> CI/CD -> Variables):
#   IRONHIDE_API_KEY   your agent's key (from `ironhide connect`)   [required]
#   IRONHIDE_AGENT_ID  the connected agent's id                     [required unless a .ironhide.yml is committed]
#   GITLAB_TOKEN       project access token, `api` scope            [optional — only to post the MR note; CI_JOB_TOKEN can't]
#
# Exit codes: 0 = PASS/WARN/INCONCLUSIVE/advisory/baseline, 1 = FAIL or BLOCK
# (when advisory_mode "false"), 2 = unavailable. Self-contained — no external
# fetch at runtime.

spec:
  inputs:
    stage:
      default: test
      description: Pipeline stage the job runs in.
    advisory_mode:
      default: "true"
      description: '"true" posts the verdict without failing the pipeline; "false" gates on FAIL/BLOCK.'
    block_on:
      default: exfiltration
      description: Comma-separated effect categories that hard-block when gating.
    server:
      default: "https://app.ironhideai.com"
      description: Ironhide server base URL.
    baseline:
      default: "$CI_DEFAULT_BRANCH"
      description: Baseline label this MR is gated against.
---
"ironhide":
  stage: $[[ inputs.stage ]]
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    IRONHIDE_ADVISORY: "$[[ inputs.advisory_mode ]]"
    IRONHIDE_BLOCK_ON: "$[[ inputs.block_on ]]"
    IRONHIDE_URL: "$[[ inputs.server ]]"
    IRONHIDE_BASELINE: "$[[ inputs.baseline ]]"
  script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates >/dev/null
    - curl -fsSL "${IRONHIDE_URL%/}/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      agent_args=()
      [ -n "${IRONHIDE_AGENT_ID:-}" ] && agent_args=(--agent-id "$IRONHIDE_AGENT_ID")
      set +e
      ironhide test "${agent_args[@]}" --label "${IRONHIDE_BASELINE:-$CI_DEFAULT_BRANCH}" 2>&1 | tee /tmp/ironhide.out
      code=${PIPESTATUS[0]}
      set -e
      GATE_LINE="$(grep -E '^IRONHIDE-GATE' /tmp/ironhide.out | tail -1)"
      RESULT="$(printf '%s' "$GATE_LINE" | grep -oE 'result=[A-Z_]+' | cut -d= -f2)"
    - |
      # Post/refresh one MR note with the verdict (needs GITLAB_TOKEN, api scope).
      if [ -n "${GITLAB_TOKEN:-}" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        marker="<!-- ironhide-scan -->"
        fence='```'
        body="$(printf '%s\n### Ironhide · %s\n\nObserved-state verdict — graded on what your agent **did** in a sandboxed arena under attack, not what it said. Preview basis `arena-l3-preview`.\n\n%s\n%s\n%s' \
          "$marker" "${RESULT:-UNAVAILABLE}" "$fence" "${GATE_LINE:-IRONHIDE-GATE result=${RESULT:-UNAVAILABLE}}" "$fence")"
        base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        existing="$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$base?per_page=100" | jq -r --arg m "$marker" 'map(select(.body|startswith($m))) | .[0].id // empty')"
        if [ -n "$existing" ]; then
          curl -fsS --request PUT  --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=$body" "$base/$existing" >/dev/null
        else
          curl -fsS --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=$body" "$base" >/dev/null
        fi
      fi
    - exit "${code:-2}"
