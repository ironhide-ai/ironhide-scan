# Ironhide referee gate for GitLab CI (plain remote-include form).
#
# Prefer the CI/CD component (templates/ironhide.yml) if you can:
#   include:
#     - component: $CI_SERVER_FQDN/ironhide1/ironhide-scan/ironhide@v1
#
# This file is the equivalent for a plain remote include:
#   include:
#     - remote: 'https://gitlab.com/ironhide1/ironhide-scan/-/raw/v1/templates/gitlab-ci.yml'
#
# Set masked CI/CD variables: IRONHIDE_API_KEY (required), IRONHIDE_AGENT_ID
# (unless a .ironhide.yml is committed), GITLAB_TOKEN (api scope — only to post
# the MR note; the gate works without it). Optional: IRONHIDE_ADVISORY ("true"),
# IRONHIDE_BLOCK_ON ("exfiltration"), IRONHIDE_SAMPLES, IRONHIDE_URL.
# Exit codes: 0 = PASS/WARN/INCONCLUSIVE/advisory/baseline, 1 = FAIL/BLOCK, 2 = unavailable.

ironhide:
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    IRONHIDE_ADVISORY: "true"
    IRONHIDE_BLOCK_ON: "exfiltration"
  script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates >/dev/null
    - curl -fsSL "${IRONHIDE_URL:-https://app.ironhideai.com}/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      agent_args=()
      [ -n "${IRONHIDE_AGENT_ID:-}" ] && agent_args=(--agent-id "$IRONHIDE_AGENT_ID")
      set +e
      ironhide test "${agent_args[@]}" --label "${IRONHIDE_BASELINE:-$CI_DEFAULT_BRANCH}" 2>&1 | tee /tmp/ironhide.out
      code=${PIPESTATUS[0]}
      set -e
      GATE_LINE="$(grep -E '^IRONHIDE-GATE' /tmp/ironhide.out | tail -1)"
      RESULT="$(printf '%s' "$GATE_LINE" | grep -oE 'result=[A-Z_]+' | cut -d= -f2)"
    - |
      if [ -n "${GITLAB_TOKEN:-}" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        marker="<!-- ironhide-scan -->"
        fence='```'
        body="$(printf '%s\n### Ironhide · %s\n\nObserved-state verdict — graded on what your agent **did** in a sandboxed arena under attack, not what it said. Preview basis `arena-l3-preview`.\n\n%s\n%s\n%s' \
          "$marker" "${RESULT:-UNAVAILABLE}" "$fence" "${GATE_LINE:-IRONHIDE-GATE result=${RESULT:-UNAVAILABLE}}" "$fence")"
        base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        existing="$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$base?per_page=100" | jq -r --arg m "$marker" 'map(select(.body|startswith($m))) | .[0].id // empty')"
        if [ -n "$existing" ]; then
          curl -fsS --request PUT  --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=$body" "$base/$existing" >/dev/null
        else
          curl -fsS --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=$body" "$base" >/dev/null
        fi
      fi
    - exit "${code:-2}"
